<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <!-- animated glowing orbs -->
  <g filter="url(#blur)">
    <circle cx="200" cy="120" r="130" fill="#00e5ff" opacity="0.55">
      <animate attributeName="cx" values="200;260;200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;180;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="300" r="150" fill="#ff4081" opacity="0.5">
      <animate attributeName="cx" values="1080;1010;1080" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;240;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="380" r="140" fill="#7c4dff" opacity="0.5">
      <animate attributeName="cx" values="640;720;640" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass card -->
  <rect x="60" y="45" width="1160" height="330" rx="36" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="60" y="45" width="1160" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>

  <!-- top chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    <rect x="100" y="78" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="185" y="100" text-anchor="middle">☁ Cloudflare Workers</text>
    <rect x="284" y="78" width="120" height="34" rx="17" fill="#00e676" fill-opacity="0.18" stroke="#00e676" stroke-opacity="0.6"/>
    <text x="344" y="100" text-anchor="middle" fill="#69f0ae">100% FREE</text>
    <rect x="418" y="78" width="150" height="34" rx="17" fill="#ff4081" fill-opacity="0.18" stroke="#ff4081" stroke-opacity="0.6"/>
    <text x="493" y="100" text-anchor="middle" fill="#ff80ab">ANTI-BAN 🛡</text>
  </g>

  <!-- title -->
  <text x="640" y="205" text-anchor="middle" font-family="Segoe UI, Arial Black, sans-serif" font-size="84" font-weight="900" fill="url(#title)" filter="url(#glow)">TechNamooz Panel</text>

  <!-- persian tagline -->
  <text x="640" y="258" text-anchor="middle" direction="rtl" font-family="Tahoma, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">پنل رایگان ساخت کانفیگ V2Ray روی کلودفلر | بدون بن | بدون فیلتر</text>

  <!-- protocol chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="300" y="295" width="110" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#00e5ff" stroke-opacity="0.7"/><text x="355" y="320">VLESS</text>
    <rect x="424" y="295" width="110" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#7c4dff" stroke-opacity="0.8"/><text x="479" y="320">TROJAN</text>
    <rect x="548" y="295" width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ff4081" stroke-opacity="0.8"/><text x="613" y="320">FRAGMENT</text>
    <rect x="692" y="295" width="100" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffab40" stroke-opacity="0.8"/><text x="742" y="320">WARP</text>
    <rect x="806" y="295" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffd740" stroke-opacity="0.9"/><text x="881" y="320">WARP PRO</text>
  </g>
</svg>
